<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Student Registration</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: Arial, sans-serif;
      background: linear-gradient(135deg, #1a1a2e, #16213e);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }
    .container {
      background: white;
      border-radius: 12px;
      padding: 40px;
      width: 100%;
      max-width: 600px;
      box-shadow: 0 20px 60px rgba(0,0,0,0.4);
    }
    h2 {
      text-align: center;
      color: #1a1a2e;
      margin-bottom: 30px;
      font-size: 26px;
      border-bottom: 3px solid #e94560;
      padding-bottom: 10px;
    }
    .form-group {
      margin-bottom: 18px;
    }
    label {
      display: block;
      margin-bottom: 6px;
      font-weight: bold;
      color: #333;
      font-size: 14px;
    }
    input[type="text"],
    input[type="tel"],
    textarea,
    select {
      width: 100%;
      padding: 10px 14px;
      border: 2px solid #ddd;
      border-radius: 6px;
      font-size: 14px;
      transition: border-color 0.3s;
      outline: none;
    }
    input[type="text"]:focus,
    input[type="tel"]:focus,
    textarea:focus,
    select:focus {
      border-color: #e94560;
    }
    .radio-group {
      display: flex;
      gap: 20px;
      margin-top: 6px;
    }
    .radio-group label {
      font-weight: normal;
      display: flex;
      align-items: center;
      gap: 6px;
      cursor: pointer;
    }
    textarea { resize: vertical; height: 80px; }
    input[type="submit"] {
      width: 100%;
      padding: 14px;
      background: linear-gradient(135deg, #e94560, #c0392b);
      color: white;
      border: none;
      border-radius: 6px;
      font-size: 16px;
      font-weight: bold;
      cursor: pointer;
      margin-top: 10px;
      transition: opacity 0.3s;
    }
    input[type="submit"]:hover { opacity: 0.85; }
    #result {
      margin-top: 20px;
      background: #f0f8ff;
      border: 1px solid #cce;
      border-radius: 6px;
      padding: 16px;
      font-size: 13px;
      white-space: pre-wrap;
      display: none;
    }
  </style>
</head>
<body>
  <div class="container">
    <h2>Student Registration Form</h2>
    <form id="regForm">
      <div class="form-group">
        <label>Student Name:</label>
        <input type="text" name="sname" placeholder="Enter full name" required>
      </div>
      <div class="form-group">
        <label>Contact Number:</label>
        <input type="tel" name="scon" placeholder="Enter contact number" required>
      </div>
      <div class="form-group">
        <label>Gender:</label>
        <div class="radio-group">
          <label><input type="radio" name="g" value="Male"> Male</label>
          <label><input type="radio" name="g" value="Female"> Female</label>
          <label><input type="radio" name="g" value="Other"> Other</label>
        </div>
      </div>
      <div class="form-group">
        <label>Address:</label>
        <textarea name="sadd" placeholder="Enter your address"></textarea>
      </div>
      <div class="form-group">
        <label>Hobbies:</label>
        <input type="text" name="shob" placeholder="e.g. Reading, Coding, Music">
      </div>
      <div class="form-group">
        <label>Skillset:</label>
        <input type="text" name="sss" placeholder="e.g. Python, Java, Web Dev">
      </div>
      <div class="form-group">
        <label>Highest Qualification:</label>
        <select name="shq">
          <option value="">-- Select --</option>
          <option value="10th">10th</option>
          <option value="12th">12th</option>
          <option value="Diploma">Diploma</option>
          <option value="UG">Under Graduate</option>
          <option value="PG">Post Graduate</option>
        </select>
      </div>
      <div class="form-group">
        <label>District:</label>
        <input type="text" name="sdis" placeholder="Enter your district">
      </div>
      <input type="submit" value="Register">
    </form>
    <div id="result"></div>
  </div>

  <script>
    document.getElementById('regForm').addEventListener('submit', function(e) {
      e.preventDefault();
      const form = e.target;
      const params = new URLSearchParams({
        sname: form.sname.value,
        scon:  form.scon.value,
        g:     form.querySelector('input[name="g"]:checked')?.value || '',
        sadd:  form.sadd.value,
        shob:  form.shob.value,
        sss:   form.sss.value,
        shq:   form.shq.value,
        sdis:  form.sdis.value
      });
      fetch('/process_get?' + params)
        .then(r => r.json())
        .then(data => {
          const box = document.getElementById('result');
          box.style.display = 'block';
          box.textContent = JSON.stringify(data, null, 2);
        });
    });
  </script>
</body>
</html>
